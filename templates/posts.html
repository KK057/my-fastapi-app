<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JinjaSocial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <link rel="stylesheet" href="{{url_for("static",path="Home.css")}}">
    <!-- 1. Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .post { border: 1px solid #444; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        .meta { font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
     <a class="navbar-brand" href="{{url_for("Home")}}"><h2>CANTY</h2></a><!--name of func where main HTML file called-->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarScroll">
      <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{{url_for("Home")}}" style="color: red;">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" style="color: red;">Link</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: red;">
            Link
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true" style="color: red;">Link</a>
        </li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit" style="color: red;">Search</button>
      </form>
    </div>
  </div>
</nav>

    <h3><img src="{{url_for("static",path="images.jpeg")}}" alt="cat" height="30px" width="30px">Feed</h3><br>

    <!-- Post Creation Form -->
    <section>
        <form action="/post" method="POST">
            <input type="text" name="author" placeholder="Your Name" required><br>
            <textarea name="content" placeholder="What's on your mind?" required></textarea><br>
            <button type="submit">Post to Feed</button>
        </form>
    </section>

    <hr>
{% block content %}
    <!-- This area must be here for the child to fill it! -->
{% endblock content %}
    <!-- The Feed (Jinja2 Loop) -->
    <div id="feed">
        {% for post in posts %}
        <div class="post">
            <strong>@{{ post.name }}</strong>
            <p>{{ post.role }}</p>
            <p class="content">{{post.content}}</p> 
            <div class="meta" >Posted on {{ post.date }}</div>
        </div>
        {% else %}
        <p>No posts yet. Be the first!</p>
        {% endfor %}
    </div>

</body>
</html>
